<!doctype html>
<html lang="es">

<head>
  <!-- Configuración y recursos de la página -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Galpón del Costo | Abarrotes por unidad y por mayor</title>
  <meta name="description" content="Galpón de abarrotes en Lima: productos de 16 países y marcas peruanas, por unidad o al por mayor, en Miraflores, San Isidro y Callao.">

  <!-- Carga Bootstrap es una biblioteca/framework de CSS que te proporciona clases ya preparadas -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Tipografía Manrope (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Hoja de estilos propia -->
  <link rel="stylesheet" href="css/style.css?v=7">
</head>

<body>

  <!-- Encabezado: logo | ☰ categorías | buscador | Mis pedidos | Mi cuenta | carrito -->
  <header class="cabecera sticky-top">
    <div class="container cabecera-fila">

      <a class="marca" href="#" onclick="irAPagina('Inicio'); return false">El Galpón<span> del Costo</span></a>

      <button class="btn-menu" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu-lateral"
        aria-controls="menu-lateral" aria-label="Ver categorías">
        <i class="fa-solid fa-bars"></i>
      </button>

      <form class="buscador" id="form-buscar" role="search">
        <input type="search" id="txt-buscar" placeholder="¿Qué estás buscando?" aria-label="Buscar productos" autocomplete="off">
        <button type="submit" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>

      <div class="acciones">
        <a class="accion" data-etiqueta="Mis pedidos" onclick="irAPagina('Mis pedidos')" role="button">
          <i class="fa-solid fa-box-open"></i><span>Mis pedidos</span>
        </a>
        <!-- "Mi cuenta": lo arma dibujarMenu() según haya sesión o no -->
        <div class="dropdown" id="zona-cuenta"></div>
        <a class="btn-carrito" id="btn-carrito-nav" data-etiqueta="Carrito" onclick="irAPagina('Carrito')"
          role="button" aria-label="Ver carrito">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="badge rounded-pill" id="contador-carrito"></span>
        </a>
      </div>
    </div>
  </header>

  <!-- Panel lateral que se abre con ☰ -->
  <div class="offcanvas offcanvas-start menu-lateral" tabindex="-1" id="menu-lateral" aria-labelledby="titulo-menu-lateral">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title" id="titulo-menu-lateral">Categorías</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="lista-menu" id="menu-categorias"></ul>
      <div id="menu-secciones"></div>
    </div>
  </div>


  <!-- Contenido principal de la página -->
  <main id="main-content">

  </main>

  <!-- Aquí aparecen los avisos cortos (por ejemplo "se agregó al carrito") -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="contenedor-notificaciones"></div>

  <!-- Pie de página -->
  <footer>
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span><strong>El Galpón del Costo</strong> · Precios de galpón en Lima</span>
      <span>Miraflores · San Isidro · Callao · © 2026</span>
    </div>
  </footer>

  <!-- JavaScript de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Cliente de Supabase (nuestra base de datos y API) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- JavaScript propio -->
  <script src="js/main.js?v=7"></script>

</body>

</html>
