<!doctype html>
<html lang="es">

<head>
  <!-- Configuración y recursos de la página -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ideas Digitales | Tienda</title>

  <!-- Carga Bootstrap es una biblioteca/framework de CSS que te proporciona clases ya preparadas -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Hoja de estilos propia -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">

      <!-- Nombre o logo de la página -->
      <a class="navbar-brand" href="#">ID+</a>

      <!-- Botón para mostrar/ocultar el menú en pantallas pequeñas -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menú de navegación -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="main-nav">

        </ul>
      </div>
    </div>
  </nav>


  <!-- Contenido principal de la página -->
  <main id="main-content">

  </main>

  <!-- Aquí aparecen los avisos cortos (por ejemplo "se agregó al carrito") -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="contenedor-notificaciones"></div>

  <!-- Pie de página -->
  <footer>
    <div class="container">
      2026 Ideas Digitales. Todos los derechos reservados
    </div>
  </footer>

  <!-- JavaScript de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Cliente de Supabase (nuestra base de datos y API) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- JavaScript propio -->
  <script src="js/main.js"></script>

</body>

</html>
