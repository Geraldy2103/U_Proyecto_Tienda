<header-component titulo="Solicitudes mayoristas"
  frase="Clientes que pidieron hablar con un asesor">
</header-component>


<section class="padded">
    <div class="container">
        <div id="aviso-solicitudes"></div>

        <!-- Indicadores -->
        <div class="row row-cols-2 row-cols-lg-4 g-3 mb-3" id="kpis-solicitudes"></div>

        <!-- Insight principal -->
        <div id="insight-solicitudes"></div>

        <!-- Gráficos: pendientes por asesor | por sede -->
        <div class="row g-4 mb-4">
            <div class="col-lg-8">
                <div class="panel h-100">
                    <h2 class="panel-titulo mb-1">Pendientes por asesor</h2>
                    <p class="small text-body-secondary mb-2">Quién tiene más clientes esperando respuesta</p>
                    <div class="grafico" id="grafico-asesores"></div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="panel h-100">
                    <h2 class="panel-titulo mb-1">Pendientes por sede</h2>
                    <p class="small text-body-secondary mb-3">Y cuántas esperan más de una semana</p>
                    <div id="pendientes-sede"></div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="panel">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div class="segmentador" role="group" aria-label="Filtrar por estado" id="filtro-estado"></div>
                <span class="small text-body-secondary">Las más antiguas primero</span>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0 tabla-compacta">
                    <thead>
                        <tr>
                            <th>Espera</th>
                            <th>Cliente</th>
                            <th>Asesor</th>
                            <th>Productos</th>
                            <th>Mensaje</th>
                            <th class="text-end">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-solicitudes">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
