<header-component titulo="Carrito"
  frase="Carrito de compras">

</header-component>


<section class="padded">
    <div class="container">
        <h1>Mi carrito</h1>
        <p id="resumen-carrito"></p>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th class="text-end">Precio</th>
                        <th class="text-center">Cantidad</th>
                        <th class="text-end">Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id = "tbody-carrito">
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="4" class="text-end">Total</th>
                        <th id="caja-total" class="text-end"></th>
                        <th></th>
                    </tr>
                </tfoot>
            </table>
        </div>
        <!-- Compras mayoristas: se activa con 12 unidades o más de un producto (lo llena carrito.js) -->
        <div class="card mb-3" id="caja-mayorista"></div>

        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" id="btn-seguir-comprando">
                <i class="fa-solid fa-arrow-left"></i> Seguir comprando
            </button>
            <button class="btn btn-danger" id="btn-vaciar-carrito">
                <i class="fa-regular fa-trash-can"></i> Vaciar carrito
            </button>
        </div>
    </div>
</section>
