<header-component titulo="Mis pedidos"
  frase="Historial de tus compras en El Galpón del Costo">
</header-component>

<section class="padded">
    <div class="container">
        <!-- Segmentadores: los llena mis-pedidos.js con la cantidad de pedidos de cada opción -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3" id="filtros-pedidos" hidden>
            <div class="segmentador" role="group" aria-label="Filtrar por estado" id="filtro-estado"></div>
            <div class="segmentador" role="group" aria-label="Filtrar por tipo" id="filtro-tipo"></div>
        </div>
        <p class="small text-body-secondary mb-3" id="resumen-pedidos"></p>
        <div id="aviso-mis-pedidos"></div>

        <div id="lista-pedidos"></div>
    </div>
</section>

<!-- Modal: pagar un pedido cotizado -->
<div class="modal fade" id="modal-pagar" tabindex="-1" aria-labelledby="titulo-modal-pagar" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="titulo-modal-pagar">Pagar pedido</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="aviso-pago"></div>
        <div id="formulario-pago-cotizado"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btn-confirmar-pago">Pagar</button>
      </div>
    </div>
  </div>
</div>
