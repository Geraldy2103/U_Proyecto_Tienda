<header-component titulo="Pedidos de clientes"
  frase="Cotiza envíos, marca entregas y revisa pagos">
</header-component>

<section class="padded">
    <div class="container">
        <div id="aviso-pedidos-admin"></div>

        <!-- Indicadores -->
        <div class="row row-cols-2 row-cols-lg-4 g-3 mb-3" id="kpis-pedidos"></div>

        <!-- Insight principal -->
        <div id="insight-pedidos"></div>

        <!-- Gráficos: por despachar por sede | métodos de pago -->
        <div class="row g-4 mb-4">
            <div class="col-lg-8">
                <div class="panel h-100">
                    <h2 class="panel-titulo mb-1">Por despachar, por sede</h2>
                    <p class="small text-body-secondary mb-2">Pedidos registrados que aún no se entregan</p>
                    <div class="leyenda-grafico" id="leyenda-despacho"></div>
                    <div class="grafico" id="grafico-despacho"></div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="panel h-100">
                    <h2 class="panel-titulo mb-1">Métodos de pago</h2>
                    <p class="small text-body-secondary mb-3">Pedidos pagados</p>
                    <div id="metodos-pago"></div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="panel">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div class="segmentador" role="group" aria-label="Filtrar por estado" id="filtro-estado-admin"></div>
                <span class="small text-body-secondary" id="resumen-pedidos-admin"></span>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0 tabla-compacta">
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Espera</th>
                            <th>Cliente</th>
                            <th>Entrega</th>
                            <th>Tipo</th>
                            <th class="text-end">Total</th>
                            <th>Pago</th>
                            <th>Estado</th>
                            <th class="text-end">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-pedidos-admin"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>
